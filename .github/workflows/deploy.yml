name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento nunca é cancelado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar o Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Versões do Node e do Yarn
        run: node -v && yarn -v

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build de produção
        run: yarn build

      - name: Verificar o 404.html
        run: cmp dist/index.html dist/404.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Enviar o artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://wiudev.github.io/dummy/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar o Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Instalar o Chromium do Playwright
        run: yarn playwright install --with-deps --only-shell chromium

      # O Pages entrega o HTML com Cache-Control: max-age=600 e a query string
      # não fura o cache da CDN; por isso o passo espera até 15 minutos pela
      # meta app-version com o SHA deste workflow.
      - name: Aguardar a versão publicada
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$E2E_BASE_URL" | grep -qF "content=\"$GITHUB_SHA\""; then
              echo "Versão $GITHUB_SHA no ar (tentativa $attempt)."
              exit 0
            fi
            sleep 15
          done
          echo "A versão $GITHUB_SHA não apareceu em 15 minutos." >&2
          exit 1

      - name: Smoke em produção
        run: yarn test:e2e --grep @smoke

      - name: Publicar o relatório do smoke
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-producao
          path: playwright-report/
          retention-days: 14
